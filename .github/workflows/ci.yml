name: CI

# Lint and build on every push and pull request - AGENTS.md requires both to pass.
# No deploy step: deploying needs tenant credentials, which stay out of this repository.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p ui/tsconfig.json
      - run: npm run build
